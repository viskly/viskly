#
# Asks the author of every pull request to sign CLA.md once, and records who has in
# signatures/cla.json on main. CONTRIBUTING.md explains why the agreement exists.
#
# pull_request_target runs with write access even for pull requests from forks, which is
# safe here only because nothing from the pull request is checked out or executed: the
# action reads comments and the list of commit authors, nothing else.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check the agreement
        if: >-
          github.event_name == 'pull_request_target'
          || github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        # Pinned to the commit of v2.6.1. The project is archived: it gets no fixes, and it
        # runs with write access, so a moved tag must not be able to change what runs here.
        # To be replaced by a maintained equivalent.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/viskly/viskly/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: main
          # The copyright holder needs no licence to their own project; bots have no
          # rights to grant.
          allowlist: k-krawczyk,dependabot[bot]
