#
# Runs the unit tests on every pull request to main, so that branch protection has a check
# to require. Until this existed the tests ran only when a release tag was pushed, which is
# the worst moment to find out.
#
# pull_request, not pull_request_target: code from a fork runs here, so it gets a read-only
# token and no secrets.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS, like the release: the FFM bindings and AWT start-up are exercised where they
    # will run.
    runs-on: macos-15
    steps:
      # The same pins as release.yml; move both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test
        run: mvn -B -q test
