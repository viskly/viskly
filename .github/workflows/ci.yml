#
# Runs the unit tests on every pull request to main, and builds the application and its
# disk image on both architectures, so that branch protection has checks to require. Until
# this existed both happened only when a release tag was pushed, which is the worst moment
# to find out.
#
# The build is the release build minus the Developer ID: signed ad-hoc, not notarised. It
# still runs build-natives.sh, the whole of build-app.sh with its link check and signature
# verification, and the disk image.
#
# pull_request, not pull_request_target: code from a fork runs here, so it gets a read-only
# token and no secrets.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS, like the release: the FFM bindings and AWT start-up are exercised where they
    # will run.
    runs-on: macos-15
    steps:
      # The same pins as release.yml; move both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test
        run: mvn -B -q test

  build:
    name: Build ${{ matrix.arch }}
    strategy:
      # One architecture failing says nothing about the other; see both.
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build whisper.cpp from pinned source
        run: ./scripts/build-natives.sh

      - name: Build the application and the disk image
        env:
          VISKLY_WHISPER_NATIVES: build/whisper-natives/${{ matrix.arch }}
        # VISKLY_JDK for the same reason as in release.yml: only the Temurin setup-java
        # installed is known to pass the link check.
        run: VISKLY_JDK="${JAVA_HOME}" ./scripts/build-app.sh --dmg
